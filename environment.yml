name: does-exacto-work-yet
channels:
  - conda-forge
  - bioconda
dependencies:
  # Exacto's documented build/runtime stack.
  - python=3.10
  - pip
  - rust=1.88.0
  - pandas=2.2.3
  - polars=1.26.0
  - pyarrow=19.0.1

  # Alignment and BAM handling. samtools/htslib must be curl-enabled: the
  # reference slices and the ONT reads are range-read straight off Backblaze.
  - samtools=1.21
  - htslib=1.21
  - minimap2=2.28

  # Long-read transcriptome assembly for the `assembly` arm.
  - rnabloom=2.0.1
  - openjdk>=17

  # Short-read transcriptome assembly: the only route by which Illumina reads
  # can become the transcripts Exacto wants.
  - spades=4.0.0

  # pysam bundles a libcurl that cannot find the conda trust store on its own;
  # certifi gives pipeline.config.ensure_ca_bundle something to point it at.
  - certifi

  - pip:
      # pip rather than conda, per Exacto's install instructions.
      - pysam==0.23.0
      # The `corrected` arm. isONclust groups long reads by shared transcript
      # structure and isONcorrect polishes each read against its own group,
      # emitting one corrected read per input read — so basecalling indels are
      # removed without a consensus averaging away a minority allele, which is
      # what assembly does. Reference-free, so a novel junction defines its own
      # cluster rather than being measured against an annotation.
      - isONclust==0.0.6.1
      - isONcorrect==0.1.3.5
      # Andy's Nexus, pinned. Step 6 of his canonical PEPTIDE_PREDICTION_EXACTO
      # subworkflow is nexus_filter_rnabloom2_transcripts; running his code beats
      # reimplementing it.
      - git+https://github.com/pirl-unc/nexus.git@v0.2.0a7
