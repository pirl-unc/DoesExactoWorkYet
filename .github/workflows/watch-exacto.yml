name: Watch Exacto

# Re-test whenever Exacto releases something new.
#
# A workflow cannot subscribe to pushes in another repository — that needs a
# repository_dispatch sent from pirl-unc/exacto, which is theirs to set up, not
# ours. So this polls instead, and fires the matrix only when the resolved
# version differs from the last one recorded in results/environment.json.
#
# Polling four times a day rather than continuously: an Exacto release is not
# an event that needs answering within the hour, and each miss costs at most
# six hours of latency against a three-hour test run.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Compare the latest release against the last one tested
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/pirl-unc/exacto/releases/latest \
            | python3 -c 'import json,sys; print(json.loads(sys.stdin.read(), strict=False)["tag_name"])')"
          tested="$(python3 -c '
          import json, pathlib
          p = pathlib.Path("results/environment.json")
          print(json.loads(p.read_text()).get("exacto_version", "") if p.exists() else "")
          ')"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          # A release tag is "v0.4.7"; the installed version is "0.4.7". Compare
          # without the prefix so a leading v does not look like a new release
          # every six hours, forever.
          if [ "${latest#v}" = "${tested#v}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Exacto $latest already tested — nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Exacto $latest is new (last tested: ${tested:-none})"
          fi

      - name: Run the test against the new version
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run exacto-test.yml --ref main \
            -f exacto_version="${{ steps.check.outputs.latest }}"
          echo "dispatched Exacto test for ${{ steps.check.outputs.latest }}"

      - name: Say so in the summary either way
        run: |
          {
            echo "### Watch Exacto"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| latest release | \`${{ steps.check.outputs.latest }}\` |"
            echo "| last tested | \`${{ steps.check.outputs.tested }}\` |"
            echo "| dispatched | ${{ steps.check.outputs.changed }} |"
          } >> "$GITHUB_STEP_SUMMARY"
