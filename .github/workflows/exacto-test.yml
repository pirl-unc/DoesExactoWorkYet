name: Exacto test

# The heavy job: pull Sid's data, run Exacto over all three biopsies, score the
# result, publish the site and commit the results so the track record builds up
# over time.
#
# The matrix is sample x arm — one job per thing that can independently
# succeed or fail. Samples rather than timepoints because T1 was sequenced on
# ONT and again on PacBio, so a leg keyed on the biopsy would have to drop one.
# Arms because when a runner dies mid-job nothing after it executes, not even
# an `if: always()` upload: run 93e3d08 lost three legs that way and with them
# the assembly results they had already finished. Split, a dead assembly leg
# costs the assembly result and nothing else, and the cheap reads arm — no
# assembler, no JVM, spanning reads only — lands on its own runner regardless.
# Scoring happens inside each job because the primary-structures TSVs it reads
# are far too big to hand between jobs — only the compact scored JSON travels.
on:
  workflow_dispatch:
    inputs:
      exacto_version:
        description: "Exacto release tag, git ref, or 'latest-release'"
        default: "latest-release"
        required: false
      arms:
        description: "Space-separated arms to run (default: assembly reads)"
        default: "assembly reads"
        required: false
  schedule:
    # Monday 04:00 UTC — a fresh answer at the start of every week.
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    # Only the modules that can change the answer. Presentation code —
    # build_site, sources, assays, inventory — is deliberately excluded so a
    # label tweak does not queue a three-hour matrix behind itself.
    paths:
      - "pipeline/config.py"
      # Defines what every method IS -- its tool, thresholds and parameters --
      # so it changes the science, and was missing here. It only ever fired
      # because it happened to be edited alongside config.py or run_exacto.py;
      # a commit adding a method on its own would have silently not run, and
      # the site would have shown stale results under a new method's name.
      - "pipeline/methods.py"
      - "pipeline/fetch_osteosarc.py"
      - "pipeline/build_reference.py"
      - "pipeline/extract_reads.py"
      - "pipeline/run_exacto.py"
      - "pipeline/evaluate.py"
      # Was "scripts/**", which is why writing documentation tooling evicted a
      # queued 25-leg sweep. Only the installer decides which Exacto runs;
      # build_notes.py and build_issues.py generate documents and must not
      # queue three hours of compute.
      - "scripts/install_exacto.sh"
      - "environment.yml"
      - ".github/workflows/exacto-test.yml"

permissions:
  contents: read

concurrency:
  group: exacto-test
  cancel-in-progress: false

env:
  EXACTO_VERSION: ${{ github.event.inputs.exacto_version || 'latest-release' }}
  ARMS: ${{ github.event.inputs.arms || 'assembly reads' }}

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        sample: [T1-ONT, T2-ONT, T3-ONT, T1-PacBio, T2-ILMN]
        # One entry per method in pipeline/methods.py. reads first so it is the
        # one that starts if the runner pool is tight: it is the cheap method
        # and the likeliest to finish.
        arm: [reads, corrected, isonform, assembly, assembly-ms1,
              assembly-unspliced, assembly-permissive, spades]
        exclude:
          # Illumina reads are 150 bp. A read that short is not a transcript, so
          # the reads arm is meaningless for it, and isONclust/isONcorrect both
          # assume reads spanning shared transcript structure. Assembly is the
          # only route by which short reads reach Exacto at all. config.arms_for
          # enforces the same rule, so a leg added here by mistake skips rather
          # than producing an empty result that reads as a negative finding.
          - sample: T2-ILMN
            arm: reads
          - sample: T2-ILMN
            arm: corrected
          - sample: T2-ILMN
            arm: isonform
          - sample: T2-ILMN
            arm: assembly
          - sample: T2-ILMN
            arm: assembly-ms1
          - sample: T2-ILMN
            arm: assembly-unspliced
          - sample: T2-ILMN
            arm: assembly-permissive
          # rnaSPAdes is the short-read method; it has no long-read counterpart.
          - sample: T1-ONT
            arm: spades
          - sample: T2-ONT
            arm: spades
          - sample: T3-ONT
            arm: spades
          - sample: T1-PacBio
            arm: spades
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: bash -el {0}
    env:
      DEWY_WORK_DIR: ${{ github.workspace }}/work
      # RNA-Bloom2 is the only JVM here and sizes its Bloom filters against
      # available memory. Unbounded on a 16 GB runner it can crowd out minimap2
      # and samtools until the runner stops answering, which reports as "lost
      # communication" and yields no diagnosis. Bounded, it fails as a step —
      # which is a finding this harness knows how to publish.
      JAVA_TOOL_OPTIONS: -Xmx9g
      # Python block-buffers stdout when it is a pipe rather than a TTY, so
      # every step marker run_exacto printed during the 1h36m before T1-ONT's
      # runner died was still in the buffer when it was killed — the log shows
      # extraction finishing and then nothing at all. Unbuffered, the markers
      # stream live and survive, because GitHub persists log lines as they
      # arrive even when the runner never comes back.
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # Deliberately kept: this action deletes the runner's 4 GB swapfile to
          # reclaim disk, and these jobs die of memory, not disk. Trading swap
          # for space we do not need is how a spike becomes a dead runner.
          swap-storage: false

      - name: Set up conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install Exacto
        # Authenticates the release lookup: 25 legs sharing runner egress
        # exhaust the 60/hour unauthenticated API limit and 403 before any of
        # them does useful work.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install_exacto.sh

      - name: Cache GENCODE and the hg38 index
        uses: actions/cache@v4
        with:
          path: work/downloads
          key: refdata-${{ hashFiles('pipeline/config.py') }}
          restore-keys: refdata-

      - name: Fetch vaccine variants from osteosarc.com
        run: python -m pipeline.fetch_osteosarc

      - name: Build masked reference
        run: python -m pipeline.build_reference

      - name: Extract long reads for ${{ matrix.sample }}
        run: python -m pipeline.extract_reads --samples ${{ matrix.sample }}

      - name: Run Exacto on ${{ matrix.sample }} (${{ matrix.arm }})
        run: |
          # Into this step's stdout, not a file: GitHub persists log lines as
          # they stream, so these survive a runner that never comes back. An
          # artifact does not — the upload step never runs.
          ( while true; do
              echo "[res] $(date -u +%H:%M:%S)" \
                   "mem_avail=$(free -m | awk '/^Mem:/{print $7}')MB" \
                   "swap_used=$(free -m | awk '/^Swap:/{print $3}')MB" \
                   "disk_avail=$(df -m --output=avail "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')MB"
              sleep 60
            done ) &
          watcher=$!
          trap 'kill $watcher 2>/dev/null || true' EXIT

          python -m pipeline.run_exacto \
            --threads "$(nproc)" \
            --samples ${{ matrix.sample }} \
            --arms ${{ matrix.arm }}

      - name: Score ${{ matrix.sample }} (${{ matrix.arm }})
        run: |
          python -m pipeline.evaluate \
            --samples ${{ matrix.sample }} \
            --no-merge

      - name: Upload scored result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scored-${{ matrix.sample }}-${{ matrix.arm }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            results/scored/${{ matrix.sample }}.${{ matrix.arm }}.json
            results/environment.json
            work/reads/${{ matrix.sample }}.extraction.json

      - name: Upload Exacto outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exacto-outputs-${{ matrix.sample }}-${{ matrix.arm }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            work/exacto/${{ matrix.sample }}/${{ matrix.arm }}/run.json
            work/exacto/${{ matrix.sample }}/${{ matrix.arm }}/*.fasta
            work/exacto/${{ matrix.sample }}/${{ matrix.arm }}/logs/*.log
            work/exacto/${{ matrix.sample }}/${{ matrix.arm }}/rna_vars/*rna_variant_calls.tsv

  publish:
    needs: run
    # Publish whatever the matrix produced, including a partial result when one
    # sample crashed — a failed sample is a finding, and the site says so. But
    # not on cancellation: there is nothing to merge, so evaluate --merge-only
    # exits "no scored samples" and a run the user stopped on purpose is
    # reported back to them as a failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      DEWY_WORK_DIR: ${{ github.workspace }}/work

    steps:
      - uses: actions/checkout@v5
        with:
          # The engineering log is read from git log, and the default
          # shallow clone has exactly one commit in it — which is why the
          # deployed site showed a one-entry log while local builds showed
          # twenty.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Belt and braces. results/scored/ is gitignored, so a clean checkout does
      # not in fact carry the last run's answers — I claimed otherwise when I
      # added this. It stays because it costs nothing and it is the one thing
      # standing between a reused workspace and a verdict that silently mixes
      # this run's samples with a previous run's, possibly across Exacto
      # versions. Every sample in the verdict comes from this run or not at all.
      - name: Discard the previous run's scores
        run: find results/scored -name '*.json' -delete 2>/dev/null || true

      - name: Collect the scored samples
        uses: actions/download-artifact@v4
        with:
          pattern: scored-*
          merge-multiple: true
          path: .

      - name: Refresh the variant table
        run: python -m pipeline.fetch_osteosarc

      - name: Merge into a verdict
        run: python -m pipeline.evaluate --merge-only

      - name: Build site
        run: python -m pipeline.build_site

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(python -c 'import json; print(json.load(open("results/environment.json"))["exacto_version"])' 2>/dev/null || echo unknown)"

          # Rebase was wrong here and failed the first time it was ever exercised
          # against a main that already had results on it. results/ is generated
          # wholesale, so replaying this commit over another run's version of the
          # same files conflicts every time -- there is no merge to do, this run's
          # output simply is the answer. Reset onto whatever main is now, keeping
          # the generated files in the working tree, and commit that.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add results/
            if git diff --staged --quiet; then
              echo "results unchanged"
              exit 0
            fi
            git commit -m "results: Exacto ${version} run $(date -u +%Y-%m-%d)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push raced with another commit; retrying (${attempt}/3)"
            sleep 5
          done
          echo "could not push results after 3 attempts" >&2
          exit 1

      # Best effort: enables Pages on a repo where the workflow token is
      # allowed to. Where it is not, Pages is enabled once by hand and this
      # step has nothing to do — either way it must not block the deploy.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: publish
    # Explicit, because the default is success() over the whole ancestor graph
    # and `run` is expected to fail sometimes — a crashed sample is a finding
    # this site exists to report. Without this the first real verdict this
    # harness ever produced (15/37) was merged, committed, and never deployed:
    # publish succeeded, deploy skipped because a sibling leg had failed, and
    # the Site workflow could not pick it up either, since a push made with
    # GITHUB_TOKEN does not trigger another workflow run.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
