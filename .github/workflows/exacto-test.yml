name: Exacto test

# The heavy job: pull Sid's data, run Exacto over all three biopsies, score the
# result, publish the site and commit the results so the track record builds up
# over time.
#
# Sequencing samples run as a matrix — not timepoints. T1 was sequenced on ONT
# and again on PacBio, so a leg keyed on the biopsy would have to pick one and
# drop the other. A single job doing them all would take most of GitHub's
# six-hour ceiling; in parallel they finish in about as long as the slowest one.
# Scoring happens inside each job because the primary-structures TSVs it reads
# are far too big to hand between jobs — only the compact scored JSON travels.
on:
  workflow_dispatch:
    inputs:
      exacto_version:
        description: "Exacto release tag, git ref, or 'latest-release'"
        default: "latest-release"
        required: false
      arms:
        description: "Space-separated arms to run (default: assembly reads)"
        default: "assembly reads"
        required: false
  schedule:
    # Monday 04:00 UTC — a fresh answer at the start of every week.
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    # Only the modules that can change the answer. Presentation code —
    # build_site, sources, assays, inventory — is deliberately excluded so a
    # label tweak does not queue a three-hour matrix behind itself.
    paths:
      - "pipeline/config.py"
      - "pipeline/fetch_osteosarc.py"
      - "pipeline/build_reference.py"
      - "pipeline/extract_reads.py"
      - "pipeline/run_exacto.py"
      - "pipeline/evaluate.py"
      - "scripts/**"
      - "environment.yml"
      - ".github/workflows/exacto-test.yml"

permissions:
  contents: read

concurrency:
  group: exacto-test
  cancel-in-progress: false

env:
  EXACTO_VERSION: ${{ github.event.inputs.exacto_version || 'latest-release' }}
  ARMS: ${{ github.event.inputs.arms || 'assembly reads' }}

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        sample: [T1-ONT, T2-ONT, T3-ONT, T1-PacBio]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: bash -el {0}
    env:
      DEWY_WORK_DIR: ${{ github.workspace }}/work

    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install Exacto
        run: bash scripts/install_exacto.sh

      - name: Cache GENCODE and the hg38 index
        uses: actions/cache@v4
        with:
          path: work/downloads
          key: refdata-${{ hashFiles('pipeline/config.py') }}
          restore-keys: refdata-

      - name: Fetch vaccine variants from osteosarc.com
        run: python -m pipeline.fetch_osteosarc

      - name: Build masked reference
        run: python -m pipeline.build_reference

      - name: Extract long reads for ${{ matrix.sample }}
        run: python -m pipeline.extract_reads --samples ${{ matrix.sample }}

      - name: Run Exacto on ${{ matrix.sample }}
        run: |
          python -m pipeline.run_exacto \
            --threads "$(nproc)" \
            --samples ${{ matrix.sample }} \
            --arms $ARMS

      - name: Score ${{ matrix.sample }}
        run: |
          python -m pipeline.evaluate \
            --samples ${{ matrix.sample }} \
            --no-merge

      - name: Upload scored result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scored-${{ matrix.sample }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            results/scored/${{ matrix.sample }}.json
            results/environment.json
            work/reads/${{ matrix.sample }}.extraction.json

      - name: Upload Exacto outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exacto-outputs-${{ matrix.sample }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            work/exacto/${{ matrix.sample }}/**/run.json
            work/exacto/${{ matrix.sample }}/**/*.fasta
            work/exacto/${{ matrix.sample }}/**/logs/*.log
            work/exacto/${{ matrix.sample }}/**/rna_vars/*rna_variant_calls.tsv

  publish:
    needs: run
    # Publish whatever the matrix produced, including a partial result when one
    # sample crashed — a failed sample is a finding, and the site says so. But
    # not on cancellation: there is nothing to merge, so evaluate --merge-only
    # exits "no scored samples" and a run the user stopped on purpose is
    # reported back to them as a failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      DEWY_WORK_DIR: ${{ github.workspace }}/work

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # results/scored/ is committed, so the checkout arrives carrying the last
      # run's answers. Left in place, a sample that succeeded last week and
      # crashed today would have last week's result silently merged in and
      # published as today's — possibly against a different Exacto version.
      # Every sample in the verdict has to come from this run or not appear.
      - name: Discard the previous run's scores
        run: find results/scored -name '*.json' -delete 2>/dev/null || true

      - name: Collect the scored samples
        uses: actions/download-artifact@v4
        with:
          pattern: scored-*
          merge-multiple: true
          path: .

      - name: Refresh the variant table
        run: python -m pipeline.fetch_osteosarc

      - name: Merge into a verdict
        run: python -m pipeline.evaluate --merge-only

      - name: Build site
        run: python -m pipeline.build_site

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --staged --quiet; then
            echo "results unchanged"
          else
            version="$(python -c 'import json; print(json.load(open("results/environment.json"))["exacto_version"])' 2>/dev/null || echo unknown)"
            git commit -m "results: Exacto ${version} run $(date -u +%Y-%m-%d)"
            # The branch may have moved while the three-hour matrix ran.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Best effort: enables Pages on a repo where the workflow token is
      # allowed to. Where it is not, Pages is enabled once by hand and this
      # step has nothing to do — either way it must not block the deploy.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
