name: CI

# Fast checks on the harness itself, so a broken encoding or a broken site build
# is caught in a minute rather than three hours into the Exacto run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Pinned: a newer ruff enables new rules and would fail a run that
      # changed nothing.
      - run: python -m pip install pytest ruff==0.16.0 osteosarc==0.15.0

      - name: Lint
        run: python -m ruff check pipeline/ tests/

      - name: Verify the frozen osteosarc catalogue
        run: python -m pipeline.fetch_osteosarc

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Site rendering tests
        run: node --test tests/test_web_results.js tests/test_web_peptides.js

      - name: Smoke test — the site builds
        run: |
          python -m pipeline.build_site
          test -s site/index.html
          test -s site/data.json
          python -c "import json; json.load(open('site/data.json'))"

      - name: Check that the frozen panel rebuilds exactly
        run: |
          cp results/vaccine_variants.json /tmp/exacto-frozen-panel.json
          python -m pipeline.fetch_osteosarc
          cmp results/vaccine_variants.json /tmp/exacto-frozen-panel.json
